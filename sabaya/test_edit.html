<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Edit Layout</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-dashboard">
    <div class="admin-main-wrapper">
        <main class="admin-content">
            <form class="luxury-form">
                <div class="form-grid">
                    <fieldset class="form-card">
                        <legend>Informations Personnelles</legend>
                        <div class="form-row-2">
                            <div class="form-group">
                                <label for="nom">Nom</label>
                                <input type="text" id="nom" name="nom" required placeholder="Ex: Benali" value="Benali">
                            </div>
                            <div class="form-group">
                                <label for="prenom">Prénom</label>
                                <input type="text" id="prenom" name="prenom" required placeholder="Ex: Sara" value="Sara">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required placeholder="Ex: sara@example.com" value="sara@example.com">
                        </div>
                    </fieldset>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
